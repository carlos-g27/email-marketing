      <!-- Á -->
      <path d="M173 166 L188 132 L203 166 M178.5 154 H197.5"/>
      <!-- U -->
      <path d="M229 132 V152 Q229 166 244 166 Q259 166 259 152 V132"/>
      <!-- R -->
      <path d="M285 166 V132 H301 C313 132 313 152 301 152 H285 M299 152 L313 166"/>
