<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Áurea Travel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Áurea Travel</title>
  <!-- Colores: dorado #C9A24B, crema #F3ECDC (y #14120F para fondo oscuro) -->
