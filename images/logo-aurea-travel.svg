    <g stroke="#C9A24B" stroke-width="1.7">
      <path d="M240 190 H250 M245 190 V202"/>
      <path d="M262 202 V190 H268 C273 190 273 197 268 197 H262 M267 197 L272 202"/>
      <path d="M284 202 L289 190 L294 202 M285.7 198 H292.3"/>
      <path d="M306 190 L311 202 L316 190"/>
      <path d="M338 190 H328 V202 H338 M328 196 H336"/>
      <path d="M350 190 V202 H359"/>
      <!-- líneas decorativas -->
      <path d="M172 196 H226 M373 196 H427" stroke-width="1"/>
    </g>
  </g>
</svg>
